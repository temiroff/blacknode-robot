[package]
name = "blacknode-robot"
version = "0.5.2"
description = "Robot contracts, connected-device lifecycle, normalized telemetry, profiles, and driver launch."
requires-blacknode = ">=0.3.0"
layer = "robot"
component-mode = true

[categories]
"Robot" = "#14b8a6"

[components.core]
description = "Robot contracts, discovery, profiles, calibration, capabilities, and driver launch descriptors."
default = true
capabilities = ["robot.contracts", "robot.profiles", "robot.calibration", "robot.discovery"]
nodes = ["nodes"]
module-root = true

[components.contracts]
description = "Canonical transport-neutral JointState, DeviceState, FaultState, robot, and joint contracts."
default = true
capabilities = ["robot.contracts"]

# Declared for the package roadmap; sources land in components/profiles/nodes.
node-types = [
  "RobotDefinition", "RobotJointDefinition", "RobotJointList"
]

[components.profiles]
description = "Robot profile storage, listing, and duplication."
default = true
capabilities = ["robot.profiles"]

# Declared for the package roadmap; sources land in components/models/nodes.
node-types = [
  "RobotProfileDuplicate", "RobotProfileList", "RobotProfileLoad", "RobotProfileSave"
]

[components.models]
description = "Driver descriptors, presets, and launch models."
default = true
capabilities = ["robot.models"]

# Declared for the package roadmap; sources land in components/calibration/nodes.
node-types = [
  "Robot", "RobotDriverDescriptor", "RobotDriverLauncher", "RobotDriverPreset"
]

[components.calibration]
description = "Calibration capture and replay."
default = true
capabilities = ["robot.calibration", "robot.calibration-control.mock"]

# Declared for the package roadmap; sources land in components/capabilities/nodes.
node-types = [
  "RobotCalibrationControl", "RobotCalibrationMockProvider",
  "RobotCalibrationRecorder"
]

[components.capabilities]
description = "Discovery, connection health, and capability reporting."
default = true
capabilities = ["robot.capabilities"]

# Declared for the package roadmap; sources land in components/authorization/nodes.
node-types = [
  "RobotAttachment", "RobotAttachmentList", "RobotCapabilityBinding",
  "ComputeDevice", "DeviceInspect", "RobotCapabilityInspect",
  "RobotCapabilityList", "RobotCapabilityProfile",
  "RobotConnectionDashboard", "RobotDiscovery", "RobotMonitor",
  "RobotRawMonitor", "RobotRawMonitorMockProvider",
  "RobotROSCapabilityDiscover", "RobotROSInterfaceCheck", "RobotUSBDiscovery"
]

[components.devices]
description = "Connected hardware representation, configuration, discovery, lifecycle, health, and safe provider interfaces."
default = true
capabilities = [
  "robot.devices", "robot.device-state", "robot.device-lifecycle",
  "robot.device-health",
]
nodes = ["blacknode_robot/devices/nodes"]
node-types = ["HardwareCapabilities", "RobotServo"]

[components.devices.dependencies]
pip = ["pyserial>=3.5", "feetech-servo-sdk>=1.0"]
imports = ["serial", "scservo_sdk"]

[components.telemetry]
description = "Normalized robot temperatures, voltage, faults, joint state, and device-status telemetry."
default = true
capabilities = ["robot.telemetry", "robot.device-status-stream"]

[components.telemetry.adapters.mqtt]
description = "Optional MQTT publisher for normalized robot telemetry."
default = false
capabilities = ["robot.telemetry.mqtt"]

[components.telemetry.adapters.mqtt.dependencies]
pip = ["paho-mqtt>=2.1"]
imports = ["paho.mqtt.client"]

[components.authorization]
description = "Operator authorization and consequential-action gating."
default = false
capabilities = ["robot.authorization"]
