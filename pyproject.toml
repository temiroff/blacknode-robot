[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blacknode-robot"
version = "0.5.5"
description = "Robot contracts, connected-device lifecycle, and normalized telemetry for Blacknode."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "feetech-servo-sdk>=1.0", "roslibpy>=1.5"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1"]

[tool.setuptools.packages.find]
include = ["blacknode_robot*"]
